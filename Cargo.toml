[package]
name = "bellbook"
version = "0.11.0"
authors = ["Bellbook AI <contact@bellbook.ai>"]
edition = "2021"
rust-version = "1.75"
description = "Tamper-evident, replay-verifiable records of captured agent activity: content-addressed typed records, deterministic verdicts, offline receipt validation."
license = "MIT OR Apache-2.0"
repository = "https://github.com/bellbook-ai/bellbook"
homepage = "https://bellbook.ai"
documentation = "https://docs.rs/bellbook"
keywords = ["audit", "append-only", "tamper-evident", "agent", "provenance"]
categories = ["data-structures", "development-tools"]
readme = "README.md"
# Keep the published crate lean: the Python bindings and fuzz targets are their
# own crates, and the conformance corpus, its Python harness, and CI configs are
# development artifacts the library does not read at build or run time (~5.8 MB).
exclude = ["bindings", "fuzz", "spec/conformance", "conformance", ".github"]

# Standalone workspace root - intentionally not a member of any enclosing workspace.
[workspace]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["persist"]
persist = ["dep:fs4"]

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: serde_json's default float parser is best-effort and can
# land one ulp off the nearest double (411E44 parses to ...e29 instead of
# ...e28), which made JCS canonicalization non-idempotent and record ids
# depend on the textual form a number arrived in. Correctly rounded parsing
# is what RFC 8785 and the independent validator assume.
serde_json = { version = "1", features = ["float_roundtrip"] }
fs4 = { version = "1.1", optional = true }
ryu-js = "1.0.3"
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "quickstart"
required-features = ["persist"]

[[example]]
name = "export_receipt"
required-features = ["persist"]

[[example]]
name = "broken_benchmark"
required-features = ["persist"]

[[example]]
name = "iterative_evolution"
required-features = ["persist"]

[[example]]
name = "repair_reevaluate"
required-features = ["persist"]

[[test]]
name = "integration_tests"
required-features = ["persist"]

[[test]]
name = "spec_vectors"
required-features = ["persist"]

[[test]]
name = "receipt_tests"
required-features = ["persist"]

[[test]]
name = "conformance"
required-features = ["persist"]

[[test]]
name = "cli"
required-features = ["persist"]
