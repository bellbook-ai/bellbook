[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "bellbook"
version = "0.10.0"
description = "Python bindings for Bellbook: record, read, and validate tamper-evident, replay-verifiable agent-activity receipts offline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Bellbook AI", email = "contact@bellbook.ai" }]
keywords = ["audit", "tamper-evident", "provenance", "agent", "verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://bellbook.ai"
Repository = "https://github.com/bellbook-ai/bellbook"
Documentation = "https://docs.rs/bellbook"

[tool.maturin]
# Build the abi3 extension module named `bellbook`.
module-name = "bellbook"
features = ["pyo3/extension-module"]
