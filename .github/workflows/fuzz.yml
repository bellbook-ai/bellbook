name: Fuzz

# Coverage-guided fuzzing of the receipt trust boundary (issue #65). This is the
# deep layer; the always-on, per-push layer is tests/fuzz_trust_boundary.rs,
# which runs in the normal test job. Fuzzing is long-running and
# non-deterministic, so it runs on a schedule and on demand and NEVER gates a
# pull request.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Seconds to run each fuzz target"
        default: "300"

permissions:
  contents: read
  # A crash or violated invariant is a security finding (SECURITY.md); the
  # failure step below files it as an issue so it is seen where work is
  # tracked, not only in the Actions log.
  issues: write

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [validate, receipt_parse, canonical_json]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=${{ github.event.inputs.max_total_time || '300' }} \
            -rss_limit_mb=4096
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
      - name: File the finding as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="fuzz: ${TARGET} target failed on ${SHA:0:7}"
          if gh issue list --state open --search "in:title \"${title}\"" --json number --jq 'length' | grep -qv '^0$'; then
            echo "open issue already filed for this commit and target"; exit 0
          fi
          gh label create security --description "A finding against the trust boundary (SECURITY.md)" --color B60205 --force
          gh issue create --title "$title" --label security --body "$(cat <<EOF
          The coverage-guided fuzz target \`${TARGET}\` crashed or violated an invariant on \`${SHA}\`.

          Run: ${RUN_URL}
          Reproducer: the \`fuzz-artifacts-${TARGET}\` artifact on that run; reproduce with
          \`cd fuzz && cargo +nightly fuzz run ${TARGET} artifacts/${TARGET}/<crash-file>\`.

          Per SECURITY.md a fuzz finding is a security finding: root-cause it, fix it, and keep the input as a regression seed in \`tests/fuzz_trust_boundary.rs\`. Record it in \`docs/SECURITY-REVIEW.md\` section 4.
          EOF
          )"
