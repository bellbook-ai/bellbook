name: Python wheels

# Stage 3 of the Python bindings (issue #13): build the abi3 wheels and the
# sdist on every platform, so the package is proven buildable everywhere and
# is one step from publishable. Publishing (PyPI) is a later stage and a
# separate, credentialed workflow.

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - ".github/workflows/python-wheels.yml"
  push:
    branches: [main]
    paths:
      - "bindings/python/**"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          command: build
          args: --release --out dist
          working-directory: bindings/python
          manylinux: auto
      - name: Smoke test the built wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links bindings/python/dist bellbook
          python -c "import bellbook; assert bellbook.__version__ == '0.6.0', bellbook.__version__; assert bellbook.validate(b'x').status == 'invalid'; print('ok', bellbook.__version__)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-${{ matrix.os }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the sdist
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: bindings/python
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error
