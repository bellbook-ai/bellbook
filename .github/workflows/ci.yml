name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Test
        run: cargo test --locked
      # Lib tests only: the integration suite, example, and crate doctest
      # exercise the persist feature and are gated behind it.
      - name: Test (no default features)
        run: cargo test --no-default-features --lib --locked
      - name: Example
        run: cargo run --example quickstart --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Docs
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.75"
      # Dev-dependencies require a newer toolchain, so the MSRV contract
      # covers the library itself: check, not test.
      - name: Check (MSRV)
        run: cargo check --locked --all-features

  conformance-py:
    # An independent, from-scratch Python validator (no Rust code path) that
    # reproduces the published vectors and the conformance corpus. Proves
    # cross-implementation agreement on canonicalization, ids, hashes, strict
    # decoding, and structural integrity. Uses the runner's preinstalled
    # Python 3. `cryptography` is required here so the signed-vector Ed25519
    # check actually runs (BELLBOOK_REQUIRE_SIGNATURE fails the job if it is
    # ever silently skipped); it degrades to a skip only outside CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cryptography (for the signed-vector check)
        run: python3 -m pip install --user cryptography
      - name: Independent conformance validator
        run: python3 conformance/python/run_conformance.py
        env:
          BELLBOOK_REQUIRE_SIGNATURE: "1"
