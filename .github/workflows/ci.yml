name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Test
        run: cargo test --locked
      # Lib tests only: the integration suite, example, and crate doctest
      # exercise the persist feature and are gated behind it.
      - name: Test (no default features)
        run: cargo test --no-default-features --lib --locked
      - name: Example (quickstart)
        run: cargo run --example quickstart --locked
      - name: Example (export receipt)
        run: cargo run --example export_receipt --locked
      - name: Example (broken benchmark)
        run: cargo run --example broken_benchmark --locked
      - name: Example (iterative evolution)
        run: cargo run --example iterative_evolution --locked
      - name: Example (repair and reevaluate)
        run: cargo run --example repair_reevaluate --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Docs
        run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.75"
      # Dev-dependencies require a newer toolchain, so the MSRV contract
      # covers the library itself: check, not test.
      - name: Check (MSRV)
        run: cargo check --locked --all-features

  epoch-v02:
    # Epoch check (issue #34): the committed v0.2 receipts must validate
    # identically under the *published* 0.2.0 validator, not just the current
    # tree. Installs the pinned published binary from crates.io and replays
    # every committed v0.2 receipt case through it, comparing status, reason,
    # counts, and the head/rules hashes and retracted/tainted sets. This is
    # the cross-version half of the compatibility promise; the byte-freeze of
    # the v0.2 artifacts is enforced separately by tests/frozen_v02.rs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Install the published v0.2 validator
        run: cargo install bellbook --version 0.2.0 --root "$RUNNER_TEMP/bb020"
      - name: v0.2 receipts validate under the published v0.2 validator
        run: python3 scripts/epoch_check.py "$RUNNER_TEMP/bb020/bin/bellbook" 0.2

  epoch-v03:
    # Epoch check for spec 0.3 (issue #109): the committed v0.3 receipts must
    # validate identically under the *published* 0.7.0 validator, the last
    # crate that implemented spec 0.3. Same shape as `epoch-v02`. The
    # byte-freeze of the v0.3 artifacts is `tests/frozen_v03.rs`; identical
    # decisions under the current 0.4 validator is `tests/epoch_v03.rs`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Install the published v0.3 validator (crate 0.7.0)
        run: cargo install bellbook --version 0.7.0 --root "$RUNNER_TEMP/bb070"
      - name: v0.3 receipts validate under the published v0.3 validator
        run: python3 scripts/epoch_check.py "$RUNNER_TEMP/bb070/bin/bellbook" 0.3

  python-bindings:
    # Stage 1 of the PyO3 bindings (issue #13): build the extension and run
    # its parity tests, so the bindings cannot silently rot before the full
    # multi-platform wheel matrix lands. Single-OS on purpose; the abi3 wheel
    # matrix is a later stage.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
      - name: Build the extension and run parity tests
        working-directory: bindings/python
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --quiet maturin pytest
          maturin develop --release
          pytest tests -q

  conformance-py:
    # An independent, from-scratch Python validator (no Rust code path) that
    # reproduces the published vectors and the conformance corpus. Proves
    # cross-implementation agreement on canonicalization, ids, hashes, strict
    # decoding, and structural integrity. Uses the runner's preinstalled
    # Python 3. `cryptography` is required here so the signed-vector Ed25519
    # check actually runs (BELLBOOK_REQUIRE_SIGNATURE fails the job if it is
    # ever silently skipped); it degrades to a skip only outside CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cryptography (for the signed-vector check)
        run: python3 -m pip install --user cryptography
      - name: Independent conformance validator
        run: python3 conformance/python/run_conformance.py
        env:
          BELLBOOK_REQUIRE_SIGNATURE: "1"
