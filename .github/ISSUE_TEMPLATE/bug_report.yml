name: Bug report
description: Report reproducible incorrect behavior in Bellbook
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        For suspected security vulnerabilities, do not use this form. Follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Bellbook version
      description: Crate version, tag, or commit SHA.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Rust version, and enabled features.
      placeholder: "Ubuntu 24.04, rustc 1.75, default features"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest input or code sample that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error, report, or relevant output.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that may help reproduce or diagnose the problem.
